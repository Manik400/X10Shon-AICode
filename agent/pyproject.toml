[project]
name = "lfa-agent"
version = "0.1.0"
description = "Local-First AI browser agent and job application automation service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "aiosqlite>=0.20,<0.21",
  "httpx>=0.27,<0.28",
  "playwright>=1.47,<2",
  "psutil>=6,<7",
  "python-multipart>=0.0.9,<0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<0.25", "websockets>=12,<14"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
